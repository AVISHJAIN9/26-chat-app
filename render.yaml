services:
  - type: web
    name: aj-chat-app
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: ChatApp-Clean-Project/chat app/soen-main/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
